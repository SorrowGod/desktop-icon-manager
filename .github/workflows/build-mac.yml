name: Build Mac

on:
  workflow_dispatch:
  push:
    paths:
      - "DesktopIconManagerMac/**"
      - ".github/workflows/build-mac.yml"

jobs:
  build-mac:
    name: Build test macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify package
        working-directory: DesktopIconManagerMac
        run: |
          swift test

      - name: Build DMG
        working-directory: DesktopIconManagerMac
        run: |
          chmod +x ./scripts/build-mac.sh
          ./scripts/build-mac.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopIconManagerMac-dmg
          path: DesktopIconManagerMac/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
